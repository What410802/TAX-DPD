[workspace]
name = "tax-dpd"
version = "0.1.0"
description = "Disentangled Point Diffusion for Precise Object Placement (ICRA 2026)"
channels = ["nvidia", "conda-forge"]
platforms = ["linux-64"]

# ──────────────────────────────────────────────────────────────────────────────
# Tasks
# ──────────────────────────────────────────────────────────────────────────────
[tasks]
# Install packages that can't go through pixi's PyPI resolver:
#   • pyg extensions  → custom find-links wheel page
#   • rpad-pyg         → pinned Git revision; project install below uses --no-deps
#   • gym 0.21.0      → needs wheel==0.38.0 to build
#   • pytorch3d       → source build (run once manually)
#   • project itself  → editable install
post-install = { cmd = """
pip install \
  pyg_lib torch_scatter torch_sparse torch_cluster torch_spline_conv \
  -f https://data.pyg.org/whl/torch-2.7.0+cu128.html \
  --no-deps && \
pip install --no-deps \
  "git+https://github.com/r-pad/pyg_libs.git@990a90b509d86e2e083662e37ea7fd25e1518171" \
  "git+https://github.com/r-pad/visualize_3d.git@a9759c53462c377e28db56577b74929704af5f7d" && \
pip install -e third_party/dedo --no-deps && \
pip install -e "third_party/3D-Diffusion-Policy/3D-Diffusion-Policy" --no-deps && \
pip install -e . --no-deps
""", cwd = "." }

# gym==0.21.0 has invalid metadata rejected by pip>=24
# Install manually if needed: conda install -c conda-forge gym=0.21.0
install-gym = { cmd = "echo 'gym 0.21.0 skipped - install via conda if needed'", cwd = "." }

train-gmm = { cmd = "python scripts/train_gmm.py", cwd = "." }
train     = { cmd = "python scripts/train.py",     cwd = "." }
eval      = { cmd = "python scripts/eval.py",      cwd = "." }
placegen-one-step = { cmd = "python scripts/placegen_one_step.py", cwd = "." }
placegen-overfit-one = { cmd = "python scripts/placegen_overfit_one.py", cwd = "." }
placegen-visualize-overfit = { cmd = "python scripts/placegen_visualize_overfit.py", cwd = "." }
placegen-predict-pose = { cmd = "python scripts/placegen_predict_pose.py", cwd = "." }
placegen-train-grouped = { cmd = "python scripts/placegen_train_grouped.py", cwd = "." }
placegen-predict-grouped = { cmd = "python scripts/placegen_predict_grouped.py", cwd = "." }
placegen-predict-request = { cmd = "python scripts/placegen_predict_request.py", cwd = "." }
test-placegen-smoke = { cmd = "python -m pytest -q tests/test_placegen_artifact.py tests/test_placegen_grouped.py tests/test_rigid_dataset_placegen_center.py tests/test_rigid_transform.py tests/test_state_digest.py tests/test_tax3d_v2_sampling.py", cwd = "." }

# ──────────────────────────────────────────────────────────────────────────────
# Conda dependencies (base layer)
# ──────────────────────────────────────────────────────────────────────────────
[dependencies]
python      = "3.9.*"
pip         = ">=23.3.1"
setuptools  = "65.5.*"
wheel       = "*"

# ──────────────────────────────────────────────────────────────────────────────
# PyPI dependencies (everything pixi's resolver can handle)
# ──────────────────────────────────────────────────────────────────────────────
[pypi-options]
extra-index-urls = ["https://download.pytorch.org/whl/cu128"]

[pypi-dependencies]
# PyTorch stack (CUDA 12.8 / RTX 50xx Blackwell)
torch       = { version = "==2.7.0+cu128", index = "https://download.pytorch.org/whl/cu128" }
torchvision = { version = "==0.22.0+cu128", index = "https://download.pytorch.org/whl/cu128" }
torchaudio  = { version = "==2.7.0+cu128", index = "https://download.pytorch.org/whl/cu128" }
torch-geometric = ">=2.6.1"

# ML framework
fvcore      = "==0.1.5.post20221221"
iopath      = "==0.1.9"
lightning   = "==2.0.3"
lightning-cloud = "==0.5.57"
diffusers   = "==0.26.3"
timm        = "==0.9.12"
torchmetrics = "*"

# Config / experiment tracking
hydra-core  = "==1.3.2"
omegaconf   = "==2.3.0"
wandb       = "==0.15.4"
huggingface_hub = "==0.24.6"

# Data
numpy       = "<1.24"
pandas      = "*"
zarr        = "==2.12.0"
dill        = "==0.3.5.1"
einops      = "==0.4.1"
numba       = "==0.56.4"
shapely     = "==2.0.2"
scipy       = "*"

# Simulation (mujoco / dm_control / pybullet)
mujoco      = "==2.3.7"
dm-control  = ">=1.0.0"
pybullet    = "==3.2.6"

# Visualization & utilities
plotly      = ">=5.0"
gif         = "*"
flask       = "*"
pytest      = "==7.3.2"
