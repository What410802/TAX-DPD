mode: eval

job_type: ${mode}_${dataset.name}

defaults:
  - dataset: rpdiff
  - model: tax3dv2
  - training: ${dataset}_${model}
  - inference: ${dataset}_${model}
  - _logging
  - _self_

seed: 42

gmm:
  gmm: null
  gmm_log_dir: "~/data/gmm_outputs"
  task_name: null
  run_id: ???

checkpoint:
  run_id: false
  alias: v0
  monitor_name: val_rmse_0
  reference: ${wandb.entity}/${wandb.project}/model-${checkpoint.run_id}:${checkpoint.alias}

resources:
  num_workers: 4
  gpus:
    - 0

wandb:
  group: rigid
