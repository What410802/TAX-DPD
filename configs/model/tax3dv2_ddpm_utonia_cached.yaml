# Reconstructed fixed-frame DDPM with frozen Utonia static slot features.
# All diffusion settings match configs/model/tax3dv2.yaml; only the geometry
# encoder adapter differs from the PointNet++ control.
name: tax3dv2
type: point
size: xS
in_channels: 3
learn_sigma: true
point_encoder: utonia_cached
feature: true
joint_encode: true
rel_pos: false
rotary: false
scene_anchor: false
frame_type: fixed
one_hot_recon: true
zero_shape: true

pred_frame: anchor_center
noisy_goal_scale: 0.0
action_context_frame: action_center
object_scale: null
scene_scale: null
pcd_scale: 3.0

diff_train_steps: 100
diff_inference_steps: 100
diff_noise_schedule: linear
diff_noise_scale: 1.0
diff_type: gaussian
diff_translation_noise_scale: false
diff_rotation_noise_scale: 45.0
time_based_weighting: even

utonia_feature_manifest: null
utonia_static_cache_limit: 128

