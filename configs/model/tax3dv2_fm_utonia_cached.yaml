# TAX3Dv2 Euclidean FM trained from frozen Utonia static slot features.
name: tax3dv2_fm
type: point
size: xS
in_channels: 3
learn_sigma: false
point_encoder: utonia_cached
feature: true
joint_encode: true
rel_pos: false
rotary: false
scene_anchor: false
frame_type: fixed
one_hot_recon: true
zero_shape: true

pred_frame: anchor_center
noisy_goal_scale: 0.0
action_context_frame: action_center
object_scale: null
scene_scale: null
pcd_scale: 3.0

diff_train_steps: 100
diff_inference_steps: 100
diff_noise_schedule: linear
diff_noise_scale: 1.0
diff_type: flow_matching_condot
diff_translation_noise_scale: false
diff_rotation_noise_scale: false
time_based_weighting: false

fm_steps: 20
fm_solver: heun
fm_time_scale: 100.0
fm_noise_scale: 0.08

utonia_feature_manifest: null
utonia_static_cache_limit: 128
